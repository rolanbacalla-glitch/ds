name: Design System Token Compiler, Packages & Production Verification

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, feature/**, feat/**]

jobs:
  verify-design-system:
    name: Build Packages, Verify WCAG 2.2, Run Unit Tests & Compile Next.js 16
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build 3-Tier Tokens & Publishable Packages (@antigravity/tokens, ui, icons)
        run: npm run build:packages

      - name: Run Automated WCAG 2.2 AA Contrast & Artefact Verification
        run: npm run verify:wcag

      - name: Run Unit & Accessibility Primitives Test Suite
        run: npm test

      - name: Run Strict TypeScript Compiler Check
        run: npx tsc --noEmit

      - name: Run ESLint Check
        run: npm run lint

      - name: Run Production Next.js 16 Standalone Build
        run: npm run build
